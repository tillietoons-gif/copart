[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copart-automation"
version = "1.0.0"
description = "Production-quality automation for interacting with a personal Copart account."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Automation Engineer", email = "user@example.com" },
]
keywords = ["copart", "automation", "playwright", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "tenacity>=8.5.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "typing-extensions>=4.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/user/copart-automation"
Repository = "https://github.com/user/copart-automation"
Issues = "https://github.com/user/copart-automation/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["copart_automation*", "tests*"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | downloads
  | logs
  | data/auth_state.json
)/
'''

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "TCH", # flake8-type-checking
]
ignore = [
    "D203",  # one blank line before class docstring (conflicts with D211)
    "D213",  # multi-line docstring summary should start at first line (conflicts with D212)
]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "ANN"]  # Ignore assert in tests, ignore annotations in tests
"copart_automation/app/browser.py" = ["S105", "S106"]  # Hardcoded paths in browser config (controlled by .env)

# Ruff isort configuration
[tool.ruff.isort]
known-first-party = ["copart_automation"]

# MyPy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
strict_optional = true
check_untyped_defs = true
exclude = [
    "downloads/",
    "logs/",
    ".venv/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "loguru.*",
    "tenacity.*",
    "beautifulsoup4.*",
    "lxml.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --strict-config --verbose -ra --cov=copart_automation --cov-report=term-missing --cov-report=html --cov-report=xml"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests/"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["copart_automation/app"]
omit = [
    "tests/*",
    "copart_automation/app/browser.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
